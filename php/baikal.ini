; Scanned from /etc/frankenphp/php.d/, the directory the static FrankenPHP
; build compiles in as its config-file-scan-dir. Without this file the server
; runs on PHP's own defaults: display_errors on, log_errors off.

; The image makes no outbound connection, and no PHP in it may open one
; through a URL stream: fopen() and file_get_contents() refuse an http://
; or ftp:// URL. Nothing in the image needs one. baikal-health speaks
; HTTP over fsockopen(), which this does not gate.
allow_url_fopen = Off

; No X-Powered-By header naming PHP and its exact version.
expose_php = Off

; Never print an error into a response. admin/index.php and
; admin/install/index.php, which serve the login and install pages before any
; authentication, do not turn this off themselves, so a warning there would
; reach an unauthenticated visitor with a file path in it. dav.php, cal.php,
; card.php and index.php already do. The admin pages also call
; error_reporting(E_ALL) at runtime, which overrides the level below for them:
; their warnings are logged, and this setting still keeps them out of the page.
display_errors = Off

; Errors go to the log instead. error_log is deliberately unset, so the errors
; go to FrankenPHP's own logger (Caddy logger http.handlers.php), which writes
; JSON to the container's stdout, where `docker logs` shows it. Pointing
; error_log at /dev/stderr does not work for uid 65532: PHP cannot reopen the
; pipe and falls back to that same logger without saying so, and a file path
; would need a writable directory the read-only root filesystem does not have.
log_errors = On

; Real errors only: no warnings, notices or deprecations. A new PHP minor
; release adds deprecations that no operator can act on, and they would bury
; the errors worth reading.
error_reporting = E_ERROR | E_PARSE | E_CORE_ERROR | E_COMPILE_ERROR | E_USER_ERROR | E_RECOVERABLE_ERROR
