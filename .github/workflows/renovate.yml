# Self-hosted Renovate for this repository and no other. It authenticates as a
# GitHub App installed here alone, so its pull requests trigger the build
# workflow the way a person's would, and it can move the action pins under
# .github/workflows, which a GITHUB_TOKEN may not write. The App's private
# key lives in the `renovate` environment, which only main may deploy to.
#
# Renovate merges its own pull requests, through the API with Rebase and
# merge, once every check on one has passed, and only while the repository
# variable BAIKAL_AUTOMERGE is `enabled`. GitHub's own auto-merge stays off,
# so that variable is the one switch. One merge per run: the merge leaves the
# other pull requests behind main, and they rebase and re-test first.
#
# Setup is in the README, under "Dependency updates".

name: renovate

on:
  # Every morning. This cron is Renovate's only clock: renovate.json sets no
  # schedule of its own, so a run GitHub starts late still opens its pull
  # requests instead of finding itself outside a window. 18:17 UTC is 05:17
  # in Melbourne under daylight saving, 04:17 outside it.
  schedule:
    - cron: '17 18 * * *'
  # A tick on the Dependency Dashboard takes effect now, not tomorrow.
  issues:
    types: [edited]
  # Every merge. A merge leaves every other open PR tested against an older
  # main, or conflicting with the new one, and GitHub re-runs nothing when a
  # base moves. renovate.json's rebaseWhen has Renovate rebase each of them on
  # its next run, so CI tests them again; this makes that run the next few
  # minutes rather than the next morning.
  push:
    branches: [main]
  # CI finishing on one of Renovate's branches, so a green pull request
  # merges now and the next follows, instead of each waiting for a morning.
  # The job checks out nothing and runs nothing from the run that triggered
  # it: Renovate reads only the default branch, so a fork's branch named
  # renovate/* gains nothing by matching.
  workflow_run: # zizmor: ignore[dangerous-triggers] justified in the comment above
    workflows: [build]
    types: [completed]
    branches: ['renovate/**']
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    name: renovate
    # Renovate rewrites the dashboard on every run, and an App's edits fire
    # events where a GITHUB_TOKEN's would not. Without the sender check every
    # run would schedule the next.
    if: >-
      github.event_name != 'issues'
      || (github.event.issue.title == 'Dependency Dashboard'
          && github.event.sender.type == 'User')
    # On the job rather than the workflow. GitHub keeps one pending run per
    # group and a newer one replaces it, so a run the `if` above skips (the
    # App's own dashboard edit, every run) would otherwise take that slot and
    # cancel a useful run waiting in it. A skipped job never joins the group:
    # on 2026-10-29 the run a dashboard edit started was skipped while a
    # workflow_run run waited here, and that run went ahead uncancelled.
    concurrency:
      group: renovate
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # For the App's key, not a deployment. The environment's branch policy
    # still holds without one, and a daily run would otherwise bury the
    # deployment history.
    environment:
      name: renovate
      deployment: false
    # Everything goes through the App token below; the job's own needs nothing.
    permissions: {}
    steps:
      # Narrowed to this repository and to the permissions Renovate uses, even
      # though the App's installation is already no wider than that.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      # No checkout. Renovate clones the repository through the token and reads
      # renovate.json from the default branch.
      - uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate
          # The action's own default is the floating major tag. Renovate's
          # github-actions manager reads this input and moves the pin, so the
          # bot updates itself through a pull request like everything else.
          renovate-version: 44.198.3
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          # Commits go through the API, which GitHub signs as the App.
          RENOVATE_PLATFORM_COMMIT: enabled
          # The kill switch, failing closed: Renovate merges only while
          # BAIKAL_AUTOMERGE is `enabled`, compared without regard to case.
          # Unset, empty or anything else forces automerge off, over
          # renovate.json and every packageRule. It acts from the next run
          # and cannot recall a merge already made.
          RENOVATE_FORCE: ${{ case(vars.BAIKAL_AUTOMERGE == 'enabled', '', '{"automerge":false}') }}
