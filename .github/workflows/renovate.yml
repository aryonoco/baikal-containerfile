# Renovate for this repository, through divbast/ci's renovate.yml. Renovate
# merges its own pull requests only while the repository variable
# BAIKAL_AUTOMERGE is `enabled`, compared without regard to case. Unset,
# empty or anything else turns automerge off from the next run.

name: renovate

on:
  # Every morning. This cron is Renovate's only clock: neither the preset nor
  # renovate.json sets a schedule for the whole repository, so a run GitHub
  # starts late still opens its pull requests instead of finding itself
  # outside a window. 18:17 UTC is 05:17 in Melbourne under daylight saving,
  # 04:17 outside it.
  schedule:
    - cron: '17 18 * * *'
  # A tick on the Dependency Dashboard takes effect now, not tomorrow.
  issues:
    types: [edited]
  # Every merge. A merge leaves every other open PR tested against an older
  # main, or conflicting with the new one, and GitHub re-runs nothing when a
  # base moves. The preset's rebaseWhen has Renovate rebase each of them on
  # its next run, so CI tests them again; this makes that run the next few
  # minutes rather than the next morning.
  push:
    branches: [main]
  # CI finishing on one of Renovate's branches, so a green pull request
  # merges now and the next follows, instead of each waiting for a morning.
  # The job checks out nothing and runs nothing from the run that triggered
  # it: Renovate reads only the default branch, so a fork's branch named
  # renovate/* gains nothing by matching.
  workflow_run: # zizmor: ignore[dangerous-triggers] justified in the comment above
    workflows: [build]
    types: [completed]
    branches: ['renovate/**']
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    name: renovate
    uses: divbast/ci/.github/workflows/renovate.yml@0a62aa8cfe2c68a0a44343d7a7693a68c06c2b3b # v2.0.0
    with:
      automerge: ${{ vars.BAIKAL_AUTOMERGE == 'enabled' }}
    # The App's key lives in this repository's `renovate` environment, and a
    # called workflow sees an environment secret only when its caller passes
    # it by name.
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
    # Renovate works through the App's token; GITHUB_TOKEN needs nothing.
    permissions: {}
