# This file runs the repository's own gates rather than a second set spelled
# out here. Every command it invokes is a justfile recipe, every version those
# recipes resolve comes from mise.toml, and both are installed from those files
# - so a green run here and a green `just ci` on a developer's machine are
# statements about the same binaries reading the same configuration. A gate
# configured one way locally and another way in CI makes one of the two a lie,
# and nothing tells you which.
#
# The shape of the pipeline is: build each architecture once on a runner of
# that architecture, hand the resulting image to every engine leg for that
# architecture, and publish by pushing the very tarballs that passed. Nothing
# is built twice and nothing is emulated, so "what ships is what was tested"
# is an identity rather than an argument from determinism - a from-source PHP
# build is not bit-reproducible, and two builds of one commit are two images.
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, and it deliberately does not publish - see the publish job's
    # condition.
    #
    # This exists to find out early that something outside this repository has
    # moved under it: the Baikal release URL or its checksum, the FrankenPHP
    # static builder's behaviour, the runner images, a linter that changed its
    # mind. It cannot collect security fixes, and it must not be described as
    # if it could: BUILDER_IMAGE and RUNTIME_IMAGE are pinned by immutable
    # @sha256: digests and the Baikal archive by checksum, so a rebuild on an
    # unchanged Containerfile re-pulls the same bytes and produces the same
    # content. Renovate is the update path, and a digest bump arriving as a
    # reviewable pull request is better than a blind weekly rebuild: it leaves
    # a record of what moved and when.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Read-only for every job. Only publish widens this, and only by what pushing a
# package and signing an attestation actually require.
permissions:
  contents: read

# One run per ref. Two pushes to main landing close together would otherwise
# race to write :latest, and the loser is whichever finishes second rather than
# whichever is newer. Superseded pull-request runs are cancelled because
# nothing depends on their result; runs on main are queued because their result
# is the published image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this job pushes, and `git ls-files` and `reuse lint`
          # read the index rather than the remote, so the checkout token has no
          # use after this step and is not worth leaving in .git/config.
          persist-credentials: false

      # Installs exactly what mise.toml pins - hadolint, ShellCheck, reuse and
      # just - so the linters that reach a verdict here are the ones the
      # developer ran, not whatever the runner image happens to carry on PATH.
      - uses: jdx/mise-action@v4

      # PHP is the one part of the toolchain mise does not supply, and
      # deliberately: its only PHP backend compiles PHP from source, which
      # would be minutes of every run in order to analyse two files. setup-php
      # installs a prebuilt 8.5 - the version the image's FrankenPHP build
      # ships - in seconds, composer.lock is what pins PHPStan, and
      # phpstan.neon fixes the analysis target regardless of which PHP runs the
      # analyser.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # Nothing here measures coverage, and Xdebug loaded into the analyser
          # is a large slowdown bought for nothing.
          coverage: none

      # The repository's own definition of "install the pinned toolchain".
      # mise-action has already done the mise half of it; this adds the
      # Composer half, and keeps CI from growing a second spelling.
      - run: just setup

      # hadolint, ShellCheck, PHPStan and reuse, at exactly the settings
      # .shellcheckrc and phpstan.neon fix. Nothing is relaxed for CI: there is
      # no `shellcheck disable=`, no PHPStan baseline and no ignoreErrors
      # anywhere in this tree, and adding one is not an accepted way to close a
      # gate.
      - run: just lint

  build:
    # One build per architecture, on a runner of that architecture. GitHub's
    # arm64 runners are free for public repositories, which is what makes this
    # affordable and retires QEMU entirely - a static PHP build under
    # qemu-aarch64 was the least predictable thing in this pipeline.
    #
    # 26.04 rather than 24.04, and the reason is podman, not novelty: 24.04
    # carries podman 4.9.3 while the deployment target runs 5.4.2, so the
    # dual-engine leg there would be proving something about an engine a whole
    # major version away from the one this estate runs. 26.04 carries 5.7.0.
    # Both 26.04 images are marked preview; that is accepted knowingly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    # Generous, because this is the from-source PHP build and a free runner has
    # a fraction of a developer machine's parallelism. Not six hours, because
    # the failure mode worth catching is a build that has stopped making
    # progress rather than one that is merely slow.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # For `just`, which owns the image's tag.
      - uses: jdx/mise-action@v4

      # A docker-container builder, which the oci exporter below requires: the
      # default docker driver cannot write an image index.
      - uses: docker/setup-buildx-action@v4

      # Tidiness, not reproducibility. A from-source PHP compile is not
      # bit-reproducible and this does not make it one; do not describe it as
      # if it did. What it buys is that two builds of a commit differ only
      # where they genuinely differ rather than in what the clock said, which
      # keeps image history and index diffs readable and makes
      # org.opencontainers.image.created mean something instead of recording
      # when a runner happened to be scheduled. Buildx reads SOURCE_DATE_EPOCH
      # out of the environment by itself.
      - name: Pin the build clock to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "${GITHUB_ENV}"

      # Keyed on the Containerfile, because everything that makes this build
      # expensive is declared there - the extension list, the builder image
      # digest, the Baikal version - so a real bump busts the cache and pays
      # for itself while editing a test or this file does not. Local timings
      # understate the value badly: ~4 minutes on a machine with eighteen cores
      # to give it, and a free runner has a small fraction of that.
      #
      # The architecture is a namespace in the key, not an input to it. Layer
      # caches are per-platform, so sharing one key between the two runners
      # would mean each restoring gigabytes it cannot use and then overwriting
      # the other's.
      - name: Cache the build layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.arch }}-${{ hashFiles('Containerfile') }}
          restore-keys: buildx-${{ matrix.arch }}-

      # Exported to a file rather than pushed, because this runs on every pull
      # request including forks, where there is no registry credential and must
      # not be one. That file is what the engine legs load and what the publish
      # job pushes, so no image is ever built twice.
      #
      # An OCI layout rather than a docker-format tarball, and that is the
      # whole reason the attestations below are possible: attestations attach
      # to an image index, and the docker exporter is the one exporter that
      # cannot write an index. BuildKit's provenance and SBOM are the only ones
      # that describe this build - mode=max records every argument, source and
      # layer - and anything bolted on afterwards is reconstruction. Carrying
      # them in the layout means keeping them without giving up build-once.
      #
      # The tag comes from the justfile so the suite and the build cannot
      # disagree about which image is under test.
      - name: Build the image
        run: |
          image=$(just --evaluate IMAGE)
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --output type=oci,dest=/tmp/image.tar,rewrite-timestamp=true \
            -f Containerfile -t "${image}" .
          # buildx's local cache exporter appends rather than replaces, so
          # without this swap the directory grows every run until it is too
          # large to restore.
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Publish the image as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image.tar
          # Long enough to be downloaded by the test legs and the publish job
          # in the same run, and no longer: this is a build intermediate, not a
          # release artefact.
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build
    # Four legs: each architecture under each engine, every one of them running
    # the single image its architecture's build job produced. The consumer runs
    # rootless Podman and development runs Docker, and Podman rejects things
    # Docker accepts, so an image proved under only one can ship a confinement
    # contract that quietly does not hold on the other.
    #
    # fail-fast off: when legs diverge, which one broke is the finding, and
    # cancelling the others throws that away.
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        engine: [docker, podman]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # For `just`, which is what invokes the suite.
      - uses: jdx/mise-action@v4

      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.arch }}
          path: /tmp

      # skopeo rather than each engine's own `load`, because the archive is an
      # OCI layout carrying attestation manifests beside the image, and skopeo
      # is the tool on the runner that reads that shape into either engine's
      # store. Its default --multi-arch=system takes the image manifest and
      # leaves the unknown/unknown attestation manifest where it is, which is
      # what an engine wants; the destination names the image outright, so
      # nothing here depends on how an engine reads an archive's RepoTags.
      #
      # The inspect afterwards is not ceremony. It is the guard against the
      # copy landing under a name the suite will not find, which would
      # otherwise surface much later as a container that "does not exist".
      - name: Load the image under test
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          image=$(just --evaluate IMAGE)
          case "${ENGINE}" in
            docker) dest="docker-daemon:${image}" ;;
            podman) dest="containers-storage:${image}" ;;
            *) echo "unknown engine ${ENGINE}" >&2; exit 1 ;;
          esac
          skopeo --version
          skopeo copy "oci-archive:/tmp/image.tar" "${dest}"
          "${ENGINE}" image inspect "${image}" >/dev/null
          "${ENGINE}" --version

      # The acceptance suite is the gate. It runs the image under the exact
      # confinement the README promises - no capabilities, read-only root, uid
      # 65532, one tmpfs, one volume - so what CI proves is what ships.
      #
      # ENGINE arrives as an environment variable rather than interpolated into
      # the command, so the recipe that runs is a constant string.
      - name: Acceptance suite
        env:
          ENGINE: ${{ matrix.engine }}
        run: just acceptance

  publish:
    needs: [lint, test]
    # Pushes only from main, and only from a push or a hand-run dispatch. Not
    # from a pull request, which has no credential and no business moving a
    # tag; and explicitly not from the schedule, because a weekly rebuild of
    # digest-pinned inputs produces identical content and republishing it would
    # be churn a digest-pinning consumer has to look at for nothing.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Push the image, and with push-to-registry below its attestation too.
      packages: write
      # Sigstore signs the provenance against the runner's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # For the imagetools plugin that merges the two architectures, not for a
      # builder: nothing is built in this job, by design. No mise here either -
      # this job runs no justfile recipe, only registry plumbing.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each artifact lands in its own directory under this path, which is what
      # keeps two files both called image.tar apart.
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: /tmp/images

      # The Containerfile is the single place the version is written, so the
      # tag is read back out of it rather than kept in step with it by hand.
      # Empty is a hard failure: publishing `ghcr.io/aryonoco/baikal:` and
      # `:latest` from a silently unmatched grep would leave the only moving
      # tag pointing at an image nobody can name.
      - name: Read the Baikal version from the Containerfile
        id: version
        run: |
          v=$(grep -oP '^ARG BAIKAL_VERSION=\K.*' Containerfile)
          if [ -z "${v}" ]; then
            echo 'no ARG BAIKAL_VERSION line in Containerfile' >&2
            exit 1
          fi
          echo "baikal=${v}" >> "${GITHUB_OUTPUT}"

      # The layouts the suite passed against, pushed unchanged. Nothing is
      # rebuilt here, which is the whole point: a from-source PHP build is not
      # bit-reproducible, so a publish that rebuilt would ship an image no test
      # had ever seen.
      #
      # skopeo rather than `docker load` and `docker push`, because that path
      # goes through the daemon's image store and drops the attestation
      # manifests on the way. `--all` copies the layout's whole index -
      # image plus provenance plus SBOM - byte for byte.
      #
      # One tag per architecture, because no CLI here can push a manifest to a
      # registry without naming it; push-by-digest is a BuildKit exporter
      # feature and reaching it would mean handing a registry credential to a
      # job that builds fork pull requests. These tags are not scaffolding to
      # be tidied away - they are the addressable halves the index points at,
      # and they are useful to anyone debugging one architecture.
      - name: Push each tested architecture
        env:
          VERSION: ${{ steps.version.outputs.baikal }}
        run: |
          for arch in amd64 arm64; do
            skopeo copy --all \
              --dest-authfile "${HOME}/.docker/config.json" \
              "oci-archive:/tmp/images/image-${arch}/image.tar" \
              "docker://ghcr.io/aryonoco/baikal:${VERSION}-${arch}"
          done

      # The multi-architecture index, assembled from manifests that are in the
      # registry because they passed. imagetools copies rather than rebuilds,
      # so :latest and :<version> resolve to exactly the two images above and
      # to the attestation manifests that came with them.
      #
      # version, revision and created live here rather than as labels in the
      # Containerfile: set once on the index, they cannot end up saying
      # different things on the two architectures. created comes from the
      # commit for the same reason SOURCE_DATE_EPOCH does - a wall clock would
      # make two publishes of one commit differ for no reason.
      #
      # --metadata-file rather than scraping `imagetools inspect`: the digest
      # is a first-class output, and taking it here saves a round-trip to the
      # registry to ask what we just wrote.
      - name: Merge the architectures into one index
        id: merge
        env:
          VERSION: ${{ steps.version.outputs.baikal }}
        run: |
          created=$(date -u -d "@$(git log -1 --pretty=%ct)" +%Y-%m-%dT%H:%M:%SZ)
          docker buildx imagetools create \
            --metadata-file /tmp/index.json \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.created=${created}" \
            -t "ghcr.io/aryonoco/baikal:${VERSION}" \
            -t "ghcr.io/aryonoco/baikal:latest" \
            "ghcr.io/aryonoco/baikal:${VERSION}-amd64" \
            "ghcr.io/aryonoco/baikal:${VERSION}-arm64"
          digest=$(jq -er '."containerimage.descriptor".digest' /tmp/index.json)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # actions/attest, not the attest-build-provenance wrapper: GitHub's own
      # release notes say v4 of that wrapper is exactly a wrapper and that new
      # work should use this action. With no predicate and no sbom-path it
      # produces the same SLSA build provenance the wrapper did.
      #
      # This answers a different question from the provenance inside the index.
      # BuildKit's says what went into the image; this one says the image came
      # out of this repository's workflow, signed against the runner's OIDC
      # identity and checkable with `gh attestation verify` by someone who
      # trusts neither GHCR nor us. Over the index digest, so one signature
      # covers both architectures.
      #
      # No storage record: they can only be created for organisation-owned
      # repositories, and this one is user-owned, so leaving it on would ask
      # for an artifact-metadata: write permission that could never be used.
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/aryonoco/baikal
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
