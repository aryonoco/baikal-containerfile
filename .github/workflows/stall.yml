# The daily stall check, through divbast/ci's stall.yml: a Renovate pull
# request that never goes green or never finishes, Renovate itself silent,
# or daily slots that should have published and did not. A scheduled run's
# failure goes to whoever last edited the cron line below.

name: stall

on:
  schedule:
    # Midway between two daily slots, which GitHub starts hours after
    # build.yml's 18:17 UTC.
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions: {}

# One run at a time; a second has nothing to add to the first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stall:
    name: stall
    uses: divbast/ci/.github/workflows/stall.yml@0a62aa8cfe2c68a0a44343d7a7693a68c06c2b3b # v2.0.0
    with:
      published: ghcr.io/divbast/baikal:latest
      slot-workflow: build.yml
    permissions:
      contents: read # read main, compare commits, the repository's age
      pull-requests: read # list Renovate's pull requests
      actions: read # list the Renovate and slot runs
      checks: read # read each pull request's check runs
      statuses: read # and its commit statuses
      packages: read # tell a private image from an absent one
