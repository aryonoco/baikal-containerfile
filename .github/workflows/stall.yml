# Fails, so GitHub emails someone, when the update machine has stopped
# without anything failing loudly: a Renovate pull request that never goes
# green or never finishes, Renovate itself silent, or daily slots that
# should have published and did not. A scheduled run's failure goes to
# whoever last edited the cron line below. The checks live in test/stall.sh.

name: stall

on:
  schedule:
    # Midway between two daily slots, which GitHub starts hours after
    # build.yml's 18:17 UTC.
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # list Renovate's pull requests
  actions: read # list the Renovate and build runs
  checks: read # read each pull request's check runs

# One run at a time; a second has nothing to add to the first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stall:
    name: stall
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPEN_DAYS: 14
      STUCK_HOURS: 24
      RUN_HOURS: 24
      LOST_SLOTS: 2
      PUBLISHED: ghcr.io/aryonoco/baikal:latest
    # Every step runs whatever the one before found, so one run names every
    # stall.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For jq
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Renovate pull requests open too long
        if: ${{ !cancelled() }}
        run: test/stall.sh open

      - name: Renovate pull requests red or pending too long
        if: ${{ !cancelled() }}
        run: test/stall.sh stuck

      - name: Renovate silent
        if: ${{ !cancelled() }}
        run: test/stall.sh renovate

      - name: Daily slots lost
        if: ${{ !cancelled() }}
        run: test/stall.sh slots
