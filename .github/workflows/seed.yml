# Runs once, by hand, and the rename that follows deletes it. It gives
# ghcr.io/divbast/baikal the images ghcr.io/aryonoco/baikal published
# before it was frozen, byte for byte, so the first daily slot under the
# new name has a :latest to compare against and never moves backwards. The
# frozen images themselves are not copied: their description says to move
# here. The digests were read from the old name just before the freeze.

name: seed

on:
  workflow_dispatch:

permissions: {}

# One run at a time; a second copies the same bytes again.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  seed:
    name: seed
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      packages: write # create ghcr.io/divbast/baikal and push its tags
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --preserve-digests fails rather than rewrite a manifest, so each tag
      # under the new name has exactly the digest it had under the old. The
      # source is public and read without credentials.
      - name: Copy the pre-freeze images
        run: |
          skopeo --version
          while read -r tag digest; do
            skopeo copy --all --preserve-digests --src-no-creds \
              --dest-authfile "${HOME}/.docker/config.json" \
              "docker://ghcr.io/aryonoco/baikal@${digest}" \
              "docker://ghcr.io/divbast/baikal:${tag}"
          done <<'EOF'
          latest sha256:366d218585c18fd83d553aa9a6079422f6c38c1781e5ccf275171b55124c15e0
          0.13.0 sha256:366d218585c18fd83d553aa9a6079422f6c38c1781e5ccf275171b55124c15e0
          0.13.0-amd64 sha256:e80ac3d20d1329f091553276f27f43bd62c471a74bdf5a5749783c4ea399fbdc
          0.13.0-arm64 sha256:965c0aab82b7e6c67814b1cd2189ab8b9273dd03d1bbce74b7d2e1430fcf68f0
          0.12.1 sha256:62ef30cda439a70d457e82126ba4c15b036fdde33937fc20d17f5533af79a466
          0.12.1-amd64 sha256:59e83adf10e67b62ac98162f35decfc64ae1f0c81fd4ae0628be7e68a7efc98e
          0.12.1-arm64 sha256:4bacab125c3bf058d6802e2689e63894c2589392c394b7fadf07b53d6254a744
          EOF
