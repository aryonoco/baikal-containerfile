[tools]
# The acceptance suite, and divbast/ci's tools, which ci-fresh builds
# before it checks .ci
"core:go" = "1.27.4"
"aqua:golangci/golangci-lint" = "2.15.0"

"aqua:hadolint/hadolint" = "2.15.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:rhysd/actionlint" = "1.7.12"
"pipx:reuse" = "6.3.0"
"aqua:casey/just" = "1.59.0"

"aqua:jqlang/jq" = "1.8.2"

"aqua:suzuki-shunsuke/pinact" = "5.0.2"
"aqua:aquasecurity/trivy" = "0.76.2"
"aqua:zizmorcore/zizmor" = "1.32.0"

[env]
# The toolchain is the one pinned above, never one go.mod's toolchain line
# would download
GOTOOLCHAIN = "local"
# Composer's vendor/ sits at the root, where Go would take it for a Go
# vendor directory once a go.mod here has a require, and refuse to build.
# readonly is the default outside vendor mode, and still refuses to edit
# go.mod.
GOFLAGS = "-mod=readonly"
